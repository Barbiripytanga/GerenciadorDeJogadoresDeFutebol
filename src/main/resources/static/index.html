<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Jogadores de Futebol</title>
  <style>
    table { border-collapse: collapse; width: 100%; margin-bottom: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    .lesionado { color: red; font-weight: bold; }
  </style>
</head>
<body>
<h1>Gerenciador de Jogadores de Futebol</h1>

<div id="mensagem"></div>

<div id="lista-jogadores"></div>

<button type="button" id="btn-incluir">Incluir novo jogador</button>
<!--formulario -->
<div id="formulario-jogador" hidden>
  <h2>Incluir novo jogador</h2>

  <form id="form-jogador">

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" required minlength="2">

    <label for="numeroCamisa">Número da camisa</label>
    <input type="number" id="numeroCamisa" name="numeroCamisa" min="1" max="99" required>

    <label for="time">Time</label>
    <input type="text" id="time" name="time" required minlength="2">

    <p>Lesionado</p>

    <input type="radio" id="nao" name="lesionado" value="false" checked>
    <label for="nao">Não</label>

    <input type="radio" id="sim" name="lesionado" value="true">
    <label for="sim">Sim</label>

    <label for="observacoes">Observações</label>
    <textarea id="observacoes" name="observacoes"></textarea>

    <button type="submit">Salvar</button>

  </form>
</div>


<footer>
  <p>Barbara de Oliveira Silva | Turma 3A Noturno | 2026</p>
  <p>Usou IA: SIM — ChatGPT e Claude. Utilizados como apoio na compreensão dos requisitos, orientação sobre HTML, CSS e JavaScript e revisão do código.</p>
</footer>

<script>
  const botaoIncluir = document.getElementById("btn-incluir");
  const formularioJogador = document.getElementById("formulario-jogador");

  botaoIncluir.addEventListener("click", function() {
    formularioJogador.hidden = false;
  });

  const formulario = document.getElementById("form-jogador");
  const mensagem = document.getElementById("mensagem");

  formulario.addEventListener("submit", function(event) {
    event.preventDefault();

    const nome = document.getElementById("nome").value.trim();
    const numeroCamisa = Number(document.getElementById("numeroCamisa").value);
    const time = document.getElementById("time").value.trim();
    const lesionado = document.querySelector('input[name="lesionado"]:checked').value;
    const observacoes = document.getElementById("observacoes").value;

    if (nome.length < 2) {
      mensagem.textContent = "O nome deve ter pelo menos 2 caracteres.";
      return;
    }

    if (time.length < 2) {
      mensagem.textContent = "O time deve ter pelo menos 2 caracteres.";
      return;
    }

    if (numeroCamisa < 1 || numeroCamisa > 99 || !Number.isFinite(numeroCamisa)) {
      mensagem.textContent = "O número da camisa deve estar entre 1 e 99.";
      return;
    }

    mensagem.textContent = "Dados validados com sucesso!";

    console.log("Nome:", nome);
    console.log("Número da camisa:", numeroCamisa);
    console.log("Time:", time);
    console.log("Lesionado:", lesionado);
    console.log("Observações:", observacoes);
  });

  async function listarJogadores(){
    try{
      const resposta = await fetch("/jogadores");
      if(!resposta.ok){
        throw new Error("Erro ao buscar jogadores: " + resposta.status);
      }

      const jogadores= await resposta.json();

      console.log("Jogadores recebidos: ", jogadores);
      return jogadores;
    } catch (erro){
      mensagem.textContent="Não foi possível carregar os jogadores.";
      console.error("Erro: ", erro);

      return [];
    }
  }
  async function mostrarJogadores() {
    const jogadores = await listarJogadores();
    const container = document.getElementById("lista-jogadores");
    container.innerHTML = "";

    if (jogadores.length === 0) {
      container.textContent = "Nenhum jogador cadastrado.";
      return;
    }

    const tabela = document.createElement("table");
    tabela.innerHTML = `<thead><tr>
      <th>Nome</th><th>Camisa</th><th>Time</th><th>Situação</th><th>Observações</th><th>Ações</th>
    </tr></thead>`;
    const corpo = document.createElement("tbody");

    for (const j of jogadores) {
      const linha = document.createElement("tr");

      for (const valor of [j.nome, j.numeroCamisa, j.time]) {
        const td = document.createElement("td");
        td.textContent = valor;
        linha.appendChild(td);
      }

      const tdSituacao = document.createElement("td");
      if (j.lesionado) {
        tdSituacao.textContent = "LESIONADO";
        tdSituacao.className = "lesionado";
      }
      linha.appendChild(tdSituacao);

      const tdObs = document.createElement("td");
      tdObs.textContent = j.observacoes ?? "";
      linha.appendChild(tdObs);

      const tdAcoes = document.createElement("td");

      const btnAlterar = document.createElement("button");
      btnAlterar.textContent = "Alterar";
      btnAlterar.addEventListener("click", () => console.log("Alterar", j.id));

      const btnExcluir = document.createElement("button");
      btnExcluir.textContent = "Excluir";
      btnExcluir.addEventListener("click", () => console.log("Excluir", j.id));

      tdAcoes.append(btnAlterar, btnExcluir);
      linha.appendChild(tdAcoes);

      corpo.appendChild(linha);
    }

    tabela.appendChild(corpo);
    container.appendChild(tabela);
  }

  mostrarJogadores();
</script>
</body>
</html>
